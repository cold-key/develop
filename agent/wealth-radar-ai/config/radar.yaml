# config/radar.yaml (v2.0 — 零 LLM 网关 + QDII 平替智能路由)
index_monitor:
  total_budget_cny: 5000            # 指数舱总预算硬上限（严格禁止超支）
  lookback_days: 120
  reset_drawdown_pct: -2.0          # 回撤收敛至 -2% 以内自动重置所有已触发档位
  cooldown_trading_days: 5          # 重置后冷却交易日数，防止震荡市浅回调反复触发
  correlation_groups:
    us_tech: 3500
    defensive_hedge: 1500
  targets:
    - symbol: "QQQ"
      source: "akshare_us"          # 国内直连推荐 akshare_us（新浪美股日线）；海外网络可用 yfinance
      market_timezone: "US"
      correlation_group: "us_tech"
      name: "纳指100 (信号锚 -> QDII平替池)"
      budget_cny: 3500
      qdii_router_enabled: true     # 触发信号时自动联动 QDII 平替智能路由与场内溢价守卫
      tiers:
        - drawdown_pct: -5.0
          amount_cny: 800
        - drawdown_pct: -10.0
          amount_cny: 1200
        - drawdown_pct: -15.0
          amount_cny: 1500
    - symbol: "518880"
      source: "akshare"
      market_timezone: "CN"
      correlation_group: "defensive_hedge"
      name: "黄金ETF (对应场外C类联接)"
      budget_cny: 1500
      qdii_router_enabled: false
      tiers:
        - drawdown_pct: -4.0
          amount_cny: 600
        - drawdown_pct: -8.0
          amount_cny: 900

qdii_router:
  benchmark_symbol: "QQQ"
  min_us_developed_top10_pct: 65.0  # 物理防老鼠仓底线：前十大重仓中美股/发达市场大盘占比 >= 65%
  max_cn_hk_top10_pct: 20.0         # 防风格漂移红线：前十大重仓中 A股+港股占比 <= 20%
  min_corr_with_benchmark: 0.65     # 近120日净值收益率与 QQQ 相关系数下限（兼容 T+1 时差）
  max_etf_premium_pct: 2.0          # 场内纳指 ETF 溢价红线（>2% 自动标红严禁追高）
  forbidden_name_keywords:
    - "持有期"
    - "定开"
    - "封闭"
    - "美元"
    - "港元"
  on_exchange_etfs:
    - code: "513100"
      name: "国泰纳指ETF"
    - code: "159941"
      name: "广发纳指ETF"
    - code: "159659"
      name: "招商纳指100ETF"
    - code: "159501"
      name: "嘉实纳指ETF"
    - code: "513300"
      name: "华夏纳指ETF"
  proxy_pool:
    - fund_code: "021277"
      holdings_code: "270023"       # 季报持仓挂在主代码(A类)下，限额与净值看 C 类代码
      name: "广发全球精选股票(QDII)人民币C"
      company: "广发基金"
      is_passive: false
    - fund_code: "022184"
      holdings_code: "100055"
      name: "富国全球科技互联网股票(QDII)C"
      company: "富国基金"
      is_passive: false
    - fund_code: "021842"
      holdings_code: "006373"
      name: "国富全球科技互联混合(QDII)人民币C"
      company: "国海富兰克林"
      is_passive: false
    - fund_code: "024239"
      holdings_code: "005698"
      name: "华夏全球科技先锋混合(QDII)C"
      company: "华夏基金"
      is_passive: false
    - fund_code: "008971"
      holdings_code: "000834"
      name: "大成纳斯达克100ETF联接(QDII)C"
      company: "大成基金"
      is_passive: true
    - fund_code: "016453"
      holdings_code: "016452"
      name: "南方纳斯达克100指数发起(QDII)C"
      company: "南方基金"
      is_passive: true
    - fund_code: "019173"
      holdings_code: "019172"
      name: "摩根纳斯达克100指数(QDII)人民币C"
      company: "摩根资产"
      is_passive: true

cb_screener:
  total_budget_cny: 3000
  reserved_ipo_cash_cny: 1000       # 建议常备的打新中签缴款机动额
  min_order_amount_cny: 2000        # “不免五”佣金防磨损护栏
  min_price: 96.0
  max_price: 108.0
  max_premium_rate_pct: 45.0
  min_ytm_pct: 0.0                  # 到期税前收益率 >= 0%，守住债底保护
  min_remaining_years: 0.8
  max_remaining_years: 2.5
  min_stock_price_cny: 2.0          # 正股现价 >= 2.0 元，远离面值退市高危区
  min_credit_rating: "A+"
  exclude_st: true
  exclude_redeem_announced: true
  top_k: 5
  notice_lookback_days: 90
  fetch_detail_keywords:
    - "不向下修正"
    - "不下修"
    - "提议向下修正"
    - "向下修正"
    - "业绩预告"
    - "评级"
    - "回售"
    - "强赎"
    - "提前赎回"
    - "立案"
    - "违约"
    - "退市"
  notice_keywords:
    - "不向下修正"
    - "不下修"
    - "提议向下修正"
    - "向下修正"
    - "回售"
    - "赎回"
    - "强赎"
    - "提前赎回"
    - "业绩预告"
    - "立案"
    - "问询函"
    - "评级"
    - "逾期"
    - "违约"
    - "退市"
    - "面值"
    - "风险提示"

position_monitor:
  cb_take_profit_price: 128.0
  cb_stop_review_price: 92.0
  cb_redeem_alert_days_remaining: 5
  cb_putback_window_alert: true
  index_take_profit_pct: 25.0
  index_c_class_max_days: 330

evidence_budget:
  max_notices_per_target: 8
  max_detail_chars_per_notice: 400
  max_news_per_target: 6
  max_chars_per_bundle: 3200
