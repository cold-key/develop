[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-radar-ai"
version = "0.1.0"
description = "面向小资金实战方案的三阶段混合投研与风控雷达（Fail-Closed + Evidence-Grounded）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "akshare>=1.14",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "httpx>=0.27",
    "google-genai>=1.0",
    "openai>=1.50",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
wealth-radar = "wealth_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
